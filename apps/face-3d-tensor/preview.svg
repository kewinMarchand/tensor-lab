<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Face 3D Tensor</title>
  <desc id="desc">Modélisation faciale 3D en temps réel avec MediaPipe Holistic et Three.js</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="meshFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6f93b8" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="leftClip"><rect x="20" y="46" width="320" height="190" rx="10"/></clipPath>
    <clipPath id="rightClip"><rect x="20" y="46" width="312" height="170" rx="10"/></clipPath>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="12" y="12" width="776" height="396" rx="18" fill="#151d27" stroke="#263241"/>

  <text x="36" y="50" fill="#e6edf3" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700">Face 3D <tspan fill="#6f93b8">Tensor</tspan></text>
  <text x="36" y="72" fill="#8b9eb3" font-family="'DM Mono', monospace" font-size="12">Repères MediaPipe · maillage 3D Three.js · export JSON</text>
  <circle cx="742" cy="46" r="5" fill="#8fb3cc"/><text x="694" y="50" fill="#8b9eb3" font-family="'DM Mono', monospace" font-size="11" text-anchor="end">LIVE</text>

  <!-- Left: flux + landmarks -->
  <g transform="translate(36,96)">
    <rect width="360" height="286" rx="14" fill="#111821" stroke="#263241"/>
    <text x="20" y="30" fill="#8b9eb3" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">FLUX + REPÈRES</text>
    <rect x="20" y="46" width="320" height="190" rx="10" fill="#0d141b" stroke="#263241"/>
    <g clip-path="url(#leftClip)">
      <g stroke="#1a2633" stroke-width="1">
        <path d="M20 84h320M20 122h320M20 160h320M20 198h320"/>
        <path d="M84 46v190M148 46v190M212 46v190M276 46v190"/>
      </g>
      <!-- face mesh overlay -->
      <g fill="none">
        <path d="M180 70c36 0 60 28 60 66 0 50-27 84-60 84s-60-34-60-84c0-38 24-66 60-66z" stroke="#6f93b8" stroke-width="1.5"/>
        <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.7">
          <path d="M180 70l-18 20-18 14 8 20-14 24 14 20-8 22 18 18 18 12 18-12 18-18-8-22 14-20-14-24 8-20-18-14z"/>
          <path d="M162 90l18 14 18-14M144 104l18 18 18-12 18 12 18-18M134 128l18 6 28-12 28 12 18-6M120 152l32 0 28 12 28-12 32 0M134 176l18-6 28 10 28-10 18 6M152 198l28 8 28-8"/>
          <path d="M162 90l-18 32M198 90l18 32M144 104l-10 48M216 104l10 48M152 136l28 4 28-4M152 136l-18 16M208 136l18 16M152 152l12 18 16 6 16-6 12-18"/>
        </g>
        <!-- features -->
        <path d="M150 126c7-7 16-7 23 0c-7 6-16 6-23 0z" stroke="#7dd3fc" stroke-width="1.4"/>
        <path d="M187 126c7-7 16-7 23 0c-7 6-16 6-23 0z" stroke="#7dd3fc" stroke-width="1.4"/>
        <circle cx="161" cy="126" r="2.2" fill="#38bdf8" stroke="none"/><circle cx="199" cy="126" r="2.2" fill="#38bdf8" stroke="none"/>
        <path d="M180 122v22m-8 5c5 3 11 3 16 0" stroke="#8fb3cc" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M162 172c6 5 12 7 18 7s12-2 18-7c-6 7-12 10-18 10s-12-3-18-10z" stroke="#b07a8f" stroke-width="1.2"/>
        <path d="M142 110c8-8 18-10 30-5M218 110c-8-8-18-10-30-5" stroke="#8fb3cc" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g fill="#7dd3fc">
        <circle cx="180" cy="70" r="1.8"/><circle cx="180" cy="220" r="1.8"/><circle cx="120" cy="136" r="1.8"/><circle cx="240" cy="136" r="1.8"/>
        <circle cx="150" cy="126" r="1.5"/><circle cx="173" cy="126" r="1.5"/><circle cx="187" cy="126" r="1.5"/><circle cx="210" cy="126" r="1.5"/>
        <circle cx="162" cy="172" r="1.5"/><circle cx="180" cy="179" r="1.5"/><circle cx="198" cy="172" r="1.5"/>
      </g>
      <!-- corner markers -->
      <g stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-opacity="0.6">
        <path d="M24 56v-6h6M336 50h-6v6M24 226v6h6M336 232h-6v-6"/>
      </g>
    </g>
    <g font-family="'DM Mono', monospace" font-size="10" fill="#8b9eb3">
      <text x="20" y="258">468 points faciaux</text>
      <text x="340" y="258" text-anchor="end" fill="#8fb3cc">MediaPipe</text>
    </g>
  </g>

  <!-- Right: 3D model -->
  <g transform="translate(412,96)">
    <rect width="352" height="286" rx="14" fill="#111821" stroke="#263241"/>
    <text x="20" y="30" fill="#8b9eb3" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">MODÈLE 3D</text>
    <rect x="20" y="46" width="312" height="170" rx="10" fill="#0d141b" stroke="#263241"/>
    <g clip-path="url(#rightClip)">
      <!-- 3D grid floor hint -->
      <g stroke="#1a2633" stroke-width="1" opacity="0.8">
        <path d="M60 196l116-30 116 30M90 204l86-22 86 22M120 210l56-14 56 14"/>
      </g>
      <!-- 3D head wireframe -->
      <g transform="translate(176,128)" fill="none">
        <ellipse rx="52" ry="66" stroke="#263241" stroke-width="1.5"/>
        <ellipse rx="52" ry="66" stroke="url(#meshFade)" stroke-width="1.2"/>
        <g stroke="#38bdf8" stroke-opacity="0.45" stroke-width="0.9">
          <ellipse rx="52" ry="66" transform="rotate(18)"/>
          <ellipse rx="52" ry="66" transform="rotate(-18)"/>
          <ellipse rx="52" ry="66" transform="rotate(36)"/>
          <ellipse rx="52" ry="66" transform="rotate(-36)"/>
          <path d="M-52 0c14-10 32-16 52-16s38 6 52 16c-14 10-32 16-52 16s-38-6-52-16z"/>
          <path d="M-46 -30c12-10 28-15 46-15s34 5 46 15M-46 30c12 10 28 15 46 15s34-5 46-15"/>
          <path d="M0 -66c14 18 22 42 22 66s-8 48-22 66c-14-18-22-42-22-66s8-48 22-66z"/>
        </g>
        <!-- feature anchors on 3D -->
        <g stroke="#7dd3fc" stroke-width="1.2" stroke-opacity="0.9">
          <path d="M-18 -12c5-5 11-5 16 0M18 -12c-5-5-11-5-16 0"/>
          <path d="M-10 22c6 6 14 6 20 0"/>
        </g>
        <g fill="#7dd3fc">
          <circle cx="-10" cy="-12" r="2.2"/><circle cx="10" cy="-12" r="2.2"/><circle cx="0" cy="24" r="2.2"/>
          <circle cx="0" cy="-66" r="2"/><circle cx="0" cy="66" r="2"/><circle cx="-52" cy="0" r="2"/><circle cx="52" cy="0" r="2"/>
        </g>
      </g>
      <!-- axis hint -->
      <g stroke-width="1.5" stroke-linecap="round" font-family="'DM Mono', monospace" font-size="8">
        <path d="M292 190l18 0" stroke="#6f93b8"/><text x="314" y="193" fill="#6f93b8">X</text>
        <path d="M292 190l0 -18" stroke="#8fb3cc"/><text x="288" y="168" fill="#8fb3cc">Y</text>
        <path d="M292 190l-12 10" stroke="#b07a8f"/><text x="274" y="204" fill="#b07a8f">Z</text>
      </g>
    </g>
    <g font-family="'DM Mono', monospace" font-size="10">
      <rect x="20" y="232" width="148" height="28" rx="8" fill="#151d27" stroke="#263241"/>
      <text x="34" y="250" fill="#8b9eb3">Three.js</text><text x="158" y="250" text-anchor="end" fill="#8fb3cc">mesh</text>
      <rect x="184" y="232" width="148" height="28" rx="8" fill="#151d27" stroke="#263241"/>
      <text x="198" y="250" fill="#8b9eb3">Export</text><text x="322" y="250" text-anchor="end" fill="#e6edf3">JSON</text>
    </g>
  </g>
</svg>
