<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Face Landmarks Tensor</title>
  <desc id="desc">Détection de repères faciaux sur image ou webcam avec MediaPipe Holistic</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect x="12" y="12" width="776" height="396" rx="18" fill="#151d27" stroke="#263241"/>

  <text x="36" y="50" fill="#e6edf3" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700">Face Landmarks <tspan fill="#6f93b8">Tensor</tspan></text>
  <text x="36" y="72" fill="#8b9eb3" font-family="'DM Mono', monospace" font-size="12">Détection de repères faciaux · MediaPipe Holistic · canvas</text>

  <g transform="translate(36,96)">
    <rect width="460" height="286" rx="14" fill="#111821" stroke="#263241"/>
    <text x="20" y="30" fill="#8b9eb3" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">IMAGE + LANDMARKS</text>
    <rect x="20" y="46" width="420" height="220" rx="10" fill="#0d141b" stroke="#263241"/>
    <!-- Face outline -->
    <g fill="none" stroke="#263241" stroke-width="2" opacity="0.6">
      <path d="M230 88c52 0 86 40 86 92 0 70-40 112-86 112s-86-42-86-112c0-52 34-92 86-92z"/>
    </g>
    <!-- Mesh/tessellation lines -->
    <g fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.55">
      <path d="M170 140l30-12 30 12M290 140l-30-12-30 12"/>
      <path d="M184 198c30 22 62 22 92 0"/>
      <path d="M230 154v20M216 174h28"/>
      <path d="M144 180c25-30 55-45 86-45s61 15 86 45"/>
      <path d="M160 210c20 30 45 45 70 45s50-15 70-45"/>
      <path d="M190 115c12 12 22 18 40 18s28-6 40-18"/>
    </g>
    <!-- Landmark points -->
    <g fill="#7dd3fc">
      <circle cx="200" cy="140" r="3"/><circle cx="230" cy="128" r="3"/><circle cx="260" cy="140" r="3"/>
      <circle cx="200" cy="140" r="1.8"/><circle cx="170" cy="140" r="1.8"/><circle cx="290" cy="140" r="1.8"/><circle cx="260" cy="140" r="1.8"/>
      <circle cx="230" cy="154" r="2.2"/><circle cx="230" cy="174" r="2.2"/><circle cx="216" cy="174" r="1.8"/><circle cx="244" cy="174" r="1.8"/>
      <circle cx="184" cy="198" r="2.2"/><circle cx="210" cy="212" r="2.2"/><circle cx="230" cy="216" r="2.2"/><circle cx="250" cy="212" r="2.2"/><circle cx="276" cy="198" r="2.2"/>
      <circle cx="230" cy="88" r="2"/><circle cx="144" cy="180" r="2"/><circle cx="316" cy="180" r="2"/><circle cx="230" cy="292" r="2"/>
      <circle cx="190" cy="115" r="1.8"/><circle cx="230" cy="133" r="1.8"/><circle cx="270" cy="115" r="1.8"/>
    </g>
  </g>

  <g transform="translate(512,96)">
    <rect width="252" height="286" rx="14" fill="#111821" stroke="#263241"/>
    <text x="20" y="30" fill="#8b9eb3" font-family="'DM Mono', monospace" font-size="11" letter-spacing="1">DÉTECTION</text>
    <g font-family="'DM Mono', monospace" font-size="10" fill="#8b9eb3">
      <text x="20" y="64">Repères visage</text><text x="232" y="64" text-anchor="end" fill="#8fb3cc">468</text>
      <rect x="20" y="74" width="212" height="8" rx="4" fill="#0d141b"/><rect x="20" y="74" width="190" height="8" rx="4" fill="#6f93b8"/>
      <text x="20" y="104">Confiance min.</text><text x="232" y="104" text-anchor="end" fill="#e6edf3">0.50</text>
      <rect x="20" y="114" width="212" height="8" rx="4" fill="#0d141b"/><rect x="20" y="114" width="106" height="8" rx="4" fill="#8fb3cc"/>
      <text x="20" y="144">Suivi lissé</text><text x="232" y="144" text-anchor="end" fill="#e6edf3">ON</text>
      <rect x="20" y="154" width="212" height="8" rx="4" fill="#0d141b"/><rect x="20" y="154" width="212" height="8" rx="4" fill="#38bdf8" opacity="0.7"/>
    </g>
    <g font-family="'DM Mono', monospace" font-size="10">
      <rect x="20" y="196" width="212" height="30" rx="8" fill="#151d27" stroke="#263241"/>
      <text x="34" y="215" fill="#8b9eb3">Entrée</text><text x="222" y="215" text-anchor="end" fill="#e6edf3">image/webcam</text>
      <rect x="20" y="236" width="212" height="30" rx="8" fill="#151d27" stroke="#263241"/>
      <text x="34" y="255" fill="#8b9eb3">Sortie</text><text x="222" y="255" text-anchor="end" fill="#8fb3cc">canvas</text>
    </g>
  </g>
</svg>